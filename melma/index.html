<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Melma</title>
<style>
/* ============================================================================
   MELMA — APERTURA (archivo único)
   Secuencia: el logo se arma → se abre, gira y se cierra → se separa →
   cada esfera vuela hacia la cámara por su propio carril → el núcleo llega
   último, abre un destello rosado degradado y todo termina en blanco limpio.
   Al terminar no queda nada de la apertura: #melmaApp queda en blanco para
   montar la aplicación real.
   ========================================================================== */
:root{color-scheme:light;--bg:#ffffff;--ink:#141015;--pink:#f52b91;--pink-deep:#c41f6c;--track:#f1e4eb;
  --bloom:radial-gradient(circle at 50% 46%,#fff8fb 0%,#ffe6f1 30%,#ffc9e2 62%,#ff9fcb 100%)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:var(--bg)}
body{overflow:hidden;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}

/* Contenedor de la aplicación real. Queda en blanco al terminar la apertura. */
#melmaApp{position:fixed;inset:0;background:var(--bg)}

/* ---------- Apertura ---------- */
.intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:hidden;background:var(--bg);pointer-events:none}
.intro[hidden]{display:none}
.stage{position:relative;width:min(74vmin,480px);aspect-ratio:1;transform:translateY(-4vmin)}
.stage.is-shaking{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
.orb{position:absolute;left:50%;top:50%;border-radius:50%;opacity:0;will-change:transform,opacity;backface-visibility:hidden;
  box-shadow:0 0 0 1px #4a1a3240,0 0 14px 3px #6b5a6324,0 10px 24px -10px #7a2a5560}
.orb img{width:100%;height:100%;display:block;border-radius:50%;user-select:none;-webkit-user-drag:none}
.orb.is-charging{box-shadow:0 0 0 1px #4a1a3240,0 0 34px 8px #ff4da870,0 0 90px 26px #ff8fc540}

/* Destello rosado degradado del golpe final; se disuelve a blanco. */
.bloom{position:absolute;inset:0;z-index:40;background:var(--bloom);opacity:0;clip-path:circle(0% at 50% 46%)}
.intro.is-impact .bloom{animation:bloom 1.1s cubic-bezier(.2,.75,.2,1) forwards}
.ring{position:absolute;left:50%;top:46%;width:30vmin;aspect-ratio:1;margin:-15vmin 0 0 -15vmin;border-radius:50%;border:2px solid #ff7ab9;opacity:0;z-index:50}
.intro.is-impact .ring{animation:ring .85s cubic-bezier(.15,.7,.25,1) forwards}
.intro.is-impact .ring.r2{animation-delay:.1s;border-color:#ffd0e6}

/* Marca + barra de carga minimalista. */
.lockup{position:absolute;left:0;right:0;bottom:calc(max(10%,env(safe-area-inset-bottom,0px)) + 6px);display:flex;flex-direction:column;align-items:center;gap:14px;z-index:7;transition:opacity .5s ease,transform .5s ease}
.lockup.is-hidden{opacity:0;transform:translateY(8px)}
.lockup .word{font-size:13px;font-weight:700;letter-spacing:.62em;padding-left:.62em;color:var(--ink)}
.track{position:relative;width:148px;height:2px;border-radius:99px;background:var(--track);overflow:hidden}
.track span{position:absolute;inset:0;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--pink-deep) 50%,var(--pink));transform:scaleX(0)}
.status{min-height:14px;font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);transition:opacity .2s ease}
.status.is-swapping{opacity:0}

/* Solo para pruebas: aparece si la URL termina en #demo. */
.demo-replay{position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));appearance:none;border:1px solid #f0c7db;background:#fff;color:var(--ink);border-radius:999px;padding:10px 16px;font:500 12px/1 Inter,system-ui,sans-serif;cursor:pointer}
.demo-replay:focus-visible{outline:2px solid var(--pink);outline-offset:3px}

@keyframes shake{0%,100%{transform:translate(0,-4vmin)}20%{transform:translate(-4px,calc(-4vmin + 3px))}40%{transform:translate(4px,calc(-4vmin - 2px))}60%{transform:translate(-3px,calc(-4vmin - 1px))}80%{transform:translate(2px,calc(-4vmin + 1px))}}
@keyframes ring{0%{opacity:.95;transform:scale(.25)}100%{opacity:0;transform:scale(4.2)}}
@keyframes bloom{0%{opacity:1;clip-path:circle(0% at 50% 46%)}45%{opacity:1;clip-path:circle(150% at 50% 46%)}100%{opacity:0;clip-path:circle(150% at 50% 46%)}}
@media(prefers-reduced-motion:reduce){.stage.is-shaking{animation:none}}
</style>
</head>
<body>

<!-- Aquí se monta la aplicación real de Melma. -->
<main id="melmaApp" aria-label="Melma"></main>

<section class="intro" id="intro" aria-label="Presentación de Melma">
  <div class="stage" id="stage" aria-hidden="true"></div>
  <div class="bloom" aria-hidden="true"></div>
  <div class="ring" aria-hidden="true"></div><div class="ring r2" aria-hidden="true"></div>
  <div class="lockup" id="lockup">
    <div class="word">MELMA</div>
    <div class="track" id="track" role="progressbar" aria-label="Abriendo Melma" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress"></span></div>
    <div class="status" id="status" aria-live="polite">Abriendo Melma</div>
  </div>
</section>

<button class="demo-replay" id="demoReplay" type="button" hidden>↻ Repetir apertura</button>

  };

  /* ===== 2. COREOGRAFÍA (ms) ============================================== */
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T = {
    assemble: 1000,   // el logo se arma
    dance: 3000,      // se abre, da una vuelta y se cierra
    separate: 450,    // se separa para que ninguna esfera roce a otra al salir
    launchGap: 300,   // salen una por una, en orden horario
    launchDur: 950,   // vuelo hacia la cámara
    chargeDur: 420,   // el núcleo toma impulso
    strikeDur: 800,   // el núcleo viene hacia ti
    exit: 1100        // el destello rosado se disuelve a blanco
  };
  const RADIUS = 0.29, SAT = 0.249, CORE = 0.335; // proporciones exactas del logotipo
  const OPEN = 0.5, GAP = 0.2, MAX_SCALE = 7, TWIST = 28;
  const DRIFT = (Math.PI * 2) * 0.04 / 1000;
  const SATS = [
    { key: 'top', angle: -90 }, { key: 'upperRight', angle: -30 }, { key: 'lowerRight', angle: 30 },
    { key: 'bottom', angle: 90 }, { key: 'lowerLeft', angle: 150 }, { key: 'upperLeft', angle: 210 }
  ];

  const $ = id => document.getElementById(id);
  const intro = $('intro'), stage = $('stage'), lockup = $('lockup');
  const statusEl = $('status'), track = $('track'), progressEl = $('progress'), demoBtn = $('demoReplay');

  /* ===== 3. UTILIDADES ==================================================== */
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
  const easeInSine = t => 1 - Math.cos((t * Math.PI) / 2);
  const easeOutBack = t => { const c = 1.5; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
  const deg = d => d * Math.PI / 180;
  const perspective = (e, max) => 1 / (1 - (1 - 1 / max) * e); // 0 = en el logo, 1 = junto a la cámara

  /* ===== 4. CONSTRUCCIÓN (una sola vez) =================================== */
  function makeOrb(key, size) {
    const el = document.createElement('div');
    el.className = 'orb';
    el.style.width = el.style.height = (size * 100) + '%';
    el.style.marginLeft = el.style.marginTop = (-size * 50) + '%';
    const img = new Image();
    img.alt = ''; img.decoding = 'async'; img.draggable = false; img.src = SPHERES[key];
    el.appendChild(img);
    stage.appendChild(el);
    return el;
  }
  const satEls = SATS.map(s => makeOrb(s.key, SAT));
  const coreEl = makeOrb('center', CORE);
  const allOrbs = [...satEls, coreEl];

  /* ===== 5. HÁPTICOS (sin interfaz; solo en el primer arranque) =========== */
  let firstRun = true;
  function haptic(kind) {
    if (!firstRun || reduceMotion) return;
    try {
      const bridge = window.MelmaHaptics;
      if (bridge && bridge.supported !== false) return kind === 'logo' ? bridge.logoPulse && bridge.logoPulse() : bridge.entryPulse && bridge.entryPulse();
      const legacy = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
      if (legacy && legacy.impact) return legacy.impact({ style: kind === 'logo' ? 'LIGHT' : 'MEDIUM' });
      const active = navigator.userActivation ? navigator.userActivation.hasBeenActive : true;
      if (active && navigator.vibrate) navigator.vibrate(kind === 'logo' ? 14 : 24);
    } catch (_) {}
  }

  /* ===== 6. CARGA REAL (opcional) ========================================= */
  // Para esperar a tus datos: window.MELMA_WAIT_FOR_APP = true antes de este script
  // y llama MelmaStartup.markReady() cuando terminen. Mientras, el logo sigue girando.
  let hostProgress = 0;
  let hostReady = window.MELMA_WAIT_FOR_APP !== true || window.MELMA_APP_READY === true;
  window.MelmaStartup = {
    setProgress: v => { hostProgress = Math.max(hostProgress, clamp(Number(v) || 0, 0, 100)); },
    markReady: () => { hostProgress = 100; hostReady = true; }
  };
  window.dispatchEvent(new Event('melma:startup-api-ready'));

  /* ===== 7. ESTADO DE CADA REPRODUCCIÓN =================================== */
  // Todo el estado vive en "run". Cada reproducción crea uno nuevo y cancela el anterior,
  // así repetir la apertura las veces que sea siempre arranca igual que la primera.
  let run = null;
  const timers = new Set();
  function later(fn, ms) {
    const id = setTimeout(() => { timers.delete(id); fn(); }, ms);
    timers.add(id);
  }
  function stopEverything() {
    if (run) { run.alive = false; cancelAnimationFrame(run.raf); }
    timers.forEach(clearTimeout); timers.clear();
  }

  function setStatus(r, label) {
    if (label === r.statusText) return;
    r.statusText = label;
    statusEl.classList.add('is-swapping');
    later(() => { if (r.alive) { statusEl.textContent = label; statusEl.classList.remove('is-swapping'); } }, 160);
  }
  function renderProgress(r, pct) {
    const target = hostReady ? pct : Math.min(pct, Math.max(hostProgress, 12) * 0.95);
    r.shown = Math.max(r.shown, target);
    progressEl.style.transform = `scaleX(${(r.shown / 100).toFixed(3)})`;
    track.setAttribute('aria-valuenow', String(Math.round(r.shown)));
    setStatus(r, r.shown < 34 ? 'Abriendo Melma' : r.shown < 78 ? 'Cargando tus datos' : 'Preparando tu espacio');
  }

  function place(el, x, y, scale, opacity, z) {
    el.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) scale(${scale.toFixed(4)})`;
    el.style.opacity = opacity.toFixed(3);
    el.style.zIndex = z;
  }

  /* ===== 8. MOTOR ========================================================= */
  const danceEnd = T.assemble + T.dance;
  const launchBase = danceEnd + T.separate;
  const chargeAt = launchBase + (SATS.length - 1) * T.launchGap + T.launchDur * 0.45;
  const strikeAt = chargeAt + T.chargeDur;

  function frame(r, now) {
    if (!r.alive) return;
    if (r.start === null) { r.start = now; r.prev = now; }
    let dt = now - r.prev; r.prev = now;
    // Si la pestaña se pausó, la animación continúa donde iba (sin saltos).
    if (dt > 120) { r.start += dt - 16; dt = 16; }
    const t = now - r.start;
    if (!hostReady && t - r.hold > launchBase - 60) r.hold += dt;
    const L = t - r.hold;
    const S = stage.offsetWidth; // se mide en cada cuadro: nunca queda en 0 ni desfasado

    const u = clamp((t - T.assemble) / T.dance);
    const theta = Math.PI * 2 * easeInOutSine(u) + DRIFT * Math.max(0, t - danceEnd);
    const openAmt = Math.pow(Math.sin(Math.PI * easeInOutSine(u)), 1.3);
    const ring = RADIUS * S * (1 + OPEN * openAmt + GAP * smooth(danceEnd, launchBase, L));

    SATS.forEach((s, i) => {
      const a = clamp((t - 260 - i * 90) / 640);
      const p = clamp((L - (launchBase + i * T.launchGap)) / T.launchDur);
      const ang = deg(s.angle) + theta + deg(TWIST) * easeInSine(p);
      const rr = ring * lerp(0.2, 1, easeOutCubic(a));
      // Cada esfera avanza hacia la cámara por su propio carril radial: nunca se cruzan.
      const k = perspective(easeInSine(p), MAX_SCALE);
      const base = lerp(0.4, 1, easeOutBack(a)) * (1 - 0.06 * openAmt);
      place(satEls[i], Math.cos(ang) * rr * k, Math.sin(ang) * rr * k, base * k,
        a * (1 - smooth(0.82, 1, p)), p > 0 ? 10 + Math.round(k * 4) : 2);
    });

    const ca = clamp((t - 60) / 700);
    let cs = lerp(0.4, 1, easeOutBack(ca)) * (1 + 0.04 * openAmt);
    cs *= 1 + 0.02 * Math.sin(t / 380) * smooth(danceEnd, danceEnd + 400, t);
    const c = clamp((L - chargeAt) / T.chargeDur);
    coreEl.classList.toggle('is-charging', c > 0);
    if (c > 0) cs *= 1 - 0.14 * easeOutCubic(c);
    const k = clamp((L - strikeAt) / T.strikeDur);
    place(coreEl, 0, 0, cs * perspective(easeInSine(k), 16), ca * (1 - smooth(0.82, 1, k)), k > 0 ? 60 : 5);

    renderProgress(r, 100 * smooth(0, launchBase - 300, t));
    lockup.classList.toggle('is-hidden', L > danceEnd + 100);
    if (!r.logoPulsed && t > 700) { r.logoPulsed = true; haptic('logo'); }

    if (!r.impacted && k >= 0.82) {
      r.impacted = true;
      intro.classList.add('is-impact');
      stage.classList.add('is-shaking');
      haptic('entry');
      later(() => finish(r), T.exit);
    }
    if (k < 1) r.raf = requestAnimationFrame(n => frame(r, n));
  }

  function finish(r) {
    if (!r.alive) return;
    r.alive = false;
    cancelAnimationFrame(r.raf);
    intro.hidden = true;              // no queda nada: pantalla en blanco
    firstRun = false;
    if (demoBtn && location.hash === '#demo') demoBtn.hidden = false;
    window.dispatchEvent(new CustomEvent('melma:intro-complete'));
  }

  function resetScene() {
    intro.hidden = false;             // primero se muestra, luego se mide y se dibuja
    intro.classList.remove('is-impact');
    stage.classList.remove('is-shaking');
    coreEl.classList.remove('is-charging');
    lockup.classList.remove('is-hidden');
    statusEl.classList.remove('is-swapping');
    statusEl.textContent = 'Abriendo Melma';
    progressEl.style.transform = 'scaleX(0)';
    track.setAttribute('aria-valuenow', '0');
    allOrbs.forEach(el => { el.style.transform = 'scale(.4)'; el.style.opacity = '0'; el.style.zIndex = ''; });
    void intro.offsetWidth;           // reinicia las animaciones CSS (ondas, destello, sacudida)
  }

  function play() {
    stopEverything();
    resetScene();
    if (demoBtn) demoBtn.hidden = true;
    const r = run = { alive: true, raf: 0, start: null, prev: 0, hold: 0, shown: 0,
      statusText: 'Abriendo Melma', logoPulsed: false, impacted: false };
    if (reduceMotion) return playReduced(r);
    r.raf = requestAnimationFrame(n => frame(r, n));
  }

  // Movimiento reducido: logo armado, barra completa y fundido a blanco.
  function playReduced(r) {
    const S = stage.offsetWidth;
    SATS.forEach((s, i) => place(satEls[i], Math.cos(deg(s.angle)) * RADIUS * S, Math.sin(deg(s.angle)) * RADIUS * S, 1, 1, 2));
    place(coreEl, 0, 0, 1, 1, 5);
    const step = () => {
      if (!r.alive) return;
      renderProgress(r, r.shown + 10);
      if (r.shown >= 100 && hostReady) {
        lockup.classList.add('is-hidden');
        allOrbs.forEach(el => { el.style.transition = 'opacity .5s ease'; el.style.opacity = '0'; });
        later(() => { allOrbs.forEach(el => { el.style.transition = ''; }); finish(r); }, 600);
      } else later(step, 120);
    };
    later(step, 200);
  }

  /* ===== 9. ARRANQUE ====================================================== */
  // API pública: MelmaIntro.replay() vuelve a reproducir la apertura sin vibración.
  window.MelmaIntro = { replay: play };
  if (demoBtn) demoBtn.addEventListener('click', play);

  const imgs = [...stage.querySelectorAll('img')];
  Promise.race([
    Promise.all(imgs.map(img => img.decode ? img.decode().catch(() => {}) : Promise.resolve())),
    new Promise(r => setTimeout(r, 2500))
  ]).then(() => requestAnimationFrame(() => requestAnimationFrame(play)));
})();
</script>
</body>
</html>
