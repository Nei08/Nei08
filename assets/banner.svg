<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Esneider de la Hoz — Melma Ice × Kannde">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2030"/><stop offset="1" stop-color="#0d1019"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2b8"/><stop offset=".35" stop-color="#f5c84a"/><stop offset=".75" stop-color="#c8901e"/><stop offset="1" stop-color="#8a5a10"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff2b8"/><stop offset=".5" stop-color="#f5c84a"/><stop offset="1" stop-color="#fff2b8"/>
      <animate attributeName="x1" values="-1;0;-1" dur="7s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1;0" dur="7s" repeatCount="indefinite"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#f2c24a" stop-opacity=".35"/><stop offset="1" stop-color="#f2c24a" stop-opacity="0"/></radialGradient>
    <g id="f">
      <path d="M0 -24 C8 -14 7 10 0 22 C-7 10 -8 -14 0 -24Z" fill="url(#gold)"/>
      <path d="M0 -22 Q1 2 0 23" stroke="#7a4a0e" stroke-width=".8" fill="none"/>
    </g>
  </defs>
  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="18" fill="url(#glow)"/>

  <!-- plumas doradas cayendo -->
  <g opacity=".95">
    <use href="#f" x="70"  y="0"><animateTransform attributeName="transform" type="translate" values="0,-40;22,300" dur="9s"  repeatCount="indefinite"/></use>
    <use href="#f" x="190" y="0"><animateTransform attributeName="transform" type="translate" values="0,-50;-30,330" dur="11s" begin="-4s" repeatCount="indefinite"/></use>
    <use href="#f" x="310" y="0"><animateTransform attributeName="transform" type="translate" values="0,-40;30,300" dur="8s"  begin="-2s" repeatCount="indefinite"/></use>
    <use href="#f" x="430" y="0"><animateTransform attributeName="transform" type="translate" values="0,-40;-20,300" dur="12s" begin="-7s" repeatCount="indefinite"/></use>
    <use href="#f" x="560" y="0"><animateTransform attributeName="transform" type="translate" values="0,-40;26,300" dur="10s" begin="-1s" repeatCount="indefinite"/></use>
    <use href="#f" x="690" y="0"><animateTransform attributeName="transform" type="translate" values="0,-40;-28,300" dur="9s"  begin="-5s" repeatCount="indefinite"/></use>
    <use href="#f" x="810" y="0"><animateTransform attributeName="transform" type="translate" values="0,-40;18,300" dur="13s" begin="-9s" repeatCount="indefinite"/></use>
    <use href="#f" x="920" y="0"><animateTransform attributeName="transform" type="translate" values="0,-40;-24,300" dur="10s" begin="-3s" repeatCount="indefinite"/></use>
    <use href="#f" x="250" y="0"><animateTransform attributeName="transform" type="translate" values="0,-40;-16,300" dur="14s" begin="-10s" repeatCount="indefinite"/></use>
    <use href="#f" x="740" y="0"><animateTransform attributeName="transform" type="translate" values="0,-40;20,300" dur="15s" begin="-6s" repeatCount="indefinite"/></use>
  </g>

  <text x="500" y="124" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="64" font-weight="800" fill="url(#txt)" letter-spacing="-1">Esneider de la Hoz</text>
  <text x="500" y="168" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#c9cedb">Front-end · Ecosistemas digitales · Conceptos de hardware</text>
  <text x="500" y="212" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#f5c84a">Melma Ice  ✦  Kannde</text>
</svg>
